<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Metallic Champagne Gold Gradients -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#A16207"/>
      <stop offset="75%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Emerald / Lime Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="50%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#BEF264"/>
    </linearGradient>

    <!-- Crystal Cyan / Azure Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Circular Path for FOOD FOR LIFE -->
    <!-- Arc along the lower left perimeter (from angle 145 to 65 deg roughly) -->
    <path id="arcFoodLife" d="M 82,312 A 206,206 0 0,0 286,454" fill="none"/>
  </defs>

  <style>
    @keyframes orbit-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes leaf-left-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg) translate(-1px, -1px); }
    }
    @keyframes leaf-right-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.5deg) translate(1px, -1px); }
    }
    @keyframes core-breathe {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sparkle-twinkle {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    .orbit-group {
      transform-origin: 250px 250px;
      animation: orbit-spin 8s linear infinite;
    }
    .core-anim {
      transform-origin: 155px 195px;
      animation: core-breathe 3.5s ease-in-out infinite;
    }
    .leaf-l-anim {
      transform-origin: 149px 158px;
      animation: leaf-left-sway 4s ease-in-out infinite;
    }
    .leaf-r-anim {
      transform-origin: 155px 158px;
      animation: leaf-right-sway 3.6s ease-in-out infinite;
    }
    .sparkle-anim {
      transform-origin: 395px 155px;
      animation: sparkle-twinkle 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Disc with subtle luxury border -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF"/>
  
  <!-- Subtle Soft Halo Glow -->
  <circle class="core-anim" cx="155" cy="195" r="95" fill="url(#haloGlow)"/>

  <!-- Outer Double Bezel Gold Rings -->
  <!-- Main Polished Gold Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldMain)" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Inner Concentric Precision Ring -->
  <circle cx="250" cy="250" r="219" fill="none" stroke="url(#goldMain)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 5"/>

  <!-- Animated Golden Light Sweep / Comet Orbit -->
  <g class="orbit-group">
    <circle cx="250" cy="250" r="232" fill="none" stroke="#FEF08A" stroke-width="9.5" stroke-dasharray="90 400" stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="482" cy="250" r="5.5" fill="#FFFFFF" filter="drop-shadow(0 0 4px #FDE047)"/>
  </g>

  <!-- Circular Slogan: FOOD FOR LIFE -->
  <g id="slogan-group">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18.5" 
          font-weight="800" 
          fill="url(#cyanGrad)" 
          letter-spacing="5">
      <textPath href="#arcFoodLife" startOffset="5%">
        FOOD FOR LIFE
      </textPath>
    </text>
    <!-- Tiny Gold Accent Beads -->
    <circle cx="75" cy="296" r="3" fill="url(#goldMain)"/>
    <circle cx="300" cy="450" r="3" fill="url(#goldMain)"/>
  </g>

  <!-- Central Emblem: Sprout & Human Vitality -->
  <g id="life-emblem">
    <!-- Head / Sun of Vitality -->
    <circle cx="152" cy="150" r="13.5" fill="url(#limeGrad)"/>
    <circle cx="152" cy="150" r="8" fill="#ECFDF5" opacity="0.75"/>

    <!-- Left Leaf (Lime & Vitality) -->
    <g class="leaf-l-anim">
      <path d="M 149,158 C 116,160 88,186 82,214 C 105,216 130,205 145,178 C 147,171 149,164 149,158 Z" 
            fill="url(#limeGrad)"/>
      <path d="M 149,158 Q 118,188 92,210" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>
    </g>

    <!-- Right Leaf (Lush Emerald) -->
    <g class="leaf-r-anim">
      <path d="M 155,158 C 182,151 210,167 216,193 C 193,199 170,189 158,173 C 156,167 155,162 155,158 Z" 
            fill="url(#emeraldGrad)"/>
      <path d="M 155,158 Q 185,175 208,190" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>
    </g>

    <!-- Fluid Stem / Human Spine / Flow of Water (Crystal Cyan) -->
    <!-- Elegantly sweeping down and forming the dynamic underline -->
    <path d="M 152,170 C 153,198 147,230 142,260 C 136,298 128,332 135,360 C 141,382 156,396 179,397 C 195,398 220,388 238,368 C 220,379 200,383 182,382 C 163,380 152,368 149,348 C 144,316 154,276 162,240 C 167,215 168,188 152,170 Z" 
          fill="url(#cyanGrad)"/>
    
    <!-- Secondary inner dynamic wave -->
    <path d="M 142,275 C 133,310 131,346 142,380 C 132,358 127,322 134,286 Z" 
          fill="url(#cyanGrad)" opacity="0.4"/>
  </g>

  <!-- Modern Brand Wordmark -->
  <g id="brand-wordmark">
    <!-- VIDA - Custom elegant modern lettering -->
    <g transform="translate(182, 178)">
      <text x="0" y="62" 
            font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="80" 
            font-weight="900" 
            font-style="italic"
            fill="url(#cyanGrad)" 
            letter-spacing="-2">
        Vida
      </text>
      <!-- Bright lime dot on the 'i' -->
      <circle cx="45" cy="8" r="5.5" fill="url(#limeGrad)"/>
    </g>

    <!-- PRO Badge - Luxury Champagne Gold -->
    <g transform="translate(198, 258)">
      <!-- Container Pill with subtle drop shadow -->
      <rect x="0" y="0" width="68" height="24" rx="12" fill="url(#goldBadge)" filter="drop-shadow(0 2px 4px rgba(180,130,20,0.3))"/>
      <rect x="0.5" y="0.5" width="67" height="23" rx="11.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>
      <!-- PRO Typography -->
      <text x="34" y="16.5" 
            font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="13.5" 
            font-weight="900" 
            fill="#4A3600" 
            text-anchor="middle" 
            letter-spacing="2.2">
        PRO
      </text>
    </g>

    <!-- SANA - Fresh Modern Grotesque -->
    <g transform="translate(276, 279)">
      <text x="0" y="0" 
            font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="52" 
            font-weight="800" 
            fill="url(#emeraldGrad)" 
            letter-spacing="-0.5">
        Sana
      </text>
    </g>
  </g>

  <!-- Twinkling Sparkles -->
  <g class="sparkle-anim">
    <path d="M 395,140 Q 395,155 410,155 Q 395,155 395,170 Q 395,155 380,155 Q 395,155 395,140 Z" fill="url(#goldMain)"/>
  </g>
  <g transform="translate(425, 200) scale(0.6)">
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="url(#goldMain)" opacity="0.85"/>
  </g>
</svg>